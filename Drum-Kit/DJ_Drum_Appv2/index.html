<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DJ Drum Pad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🎧 DJ Drum Pad</h1>
  <p>Click pads or press A S D F J K L</p>

  <div class="drum-kit">
    <div class="pad" data-key="65">Kick<br>A</div>
    <div class="pad" data-key="83">Snare<br>S</div>
    <div class="pad" data-key="68">Hi-Hat<br>D</div>
    <div class="pad" data-key="70">Clap<br>F</div>
    <div class="pad" data-key="74">Tom<br>J</div>
    <div class="pad" data-key="75">Crash<br>K</div>
    <div class="pad" data-key="76">Bass<br>L</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
