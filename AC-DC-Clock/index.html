<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Clock + Digital Clock</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="clock">
	<!-- Clock hands -->
    <div class="hand hour-hand"></div>
    <div class="hand minute-hand"></div>
    <div class="hand second-hand"></div>
    <div class="center-pin"></div>
	
	<!-- Clock markers -->
    <div class="marker marker1"></div>
    <div class="marker marker2"></div>
    <div class="marker marker3"></div>
    <div class="marker marker4"></div>
	
    <!-- Hour Numbers -->
    <div class="number" style="--i:01">01</div>
    <div class="number" style="--i:02">02</div>
    <div class="number" style="--i:03">03</div>
    <div class="number" style="--i:04">04</div>
    <div class="number" style="--i:05">05</div>
    <div class="number" style="--i:06">06</div>
    <div class="number" style="--i:07">07</div>
    <div class="number" style="--i:08">08</div>
    <div class="number" style="--i:09">09</div>
    <div class="number" style="--i:10">10</div>
    <div class="number" style="--i:11">11</div>
    <div class="number" style="--i:12">12</div>

    <!-- Digital Time -->
    <div class="digital">
      <div id="day">Mon</div>
      <div id="date">01/01/25</div>
      <div id="digital-time">00:00:00 AM</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
