<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Pikachu (Fixed Tail)</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #eaeaea;
}

/* ===== PIKACHU ===== */
.pikachu {
  position: relative;
  width: 220px;
  height: 300px;
  animation: bounce 2s infinite;
}

/* ===== HEAD ===== */
.head {
  position: relative;
  width: 200px;
  height: 180px;
  background: #ffd93b;
  border-radius: 50%;
  margin: auto;
  z-index: 2;
}

/* ===== EARS ===== */
.ear {
  position: absolute;
  width: 40px;
  height: 100px;
  background: #ffd93b;
  border-radius: 20px;
  top: -60px;
  transform-origin: bottom center;
  animation: earWiggle 1.5s infinite;
}

.ear::after {
  content: "";
  position: absolute;
  top: 0;
  width: 100%;
  height: 35px;
  background: #000;
  border-radius: 20px 20px 0 0;
}

.ear.left { left: 30px; }
.ear.right { right: 30px; animation-delay: .3s; }

/* ===== EYES ===== */
.eye {
  position: absolute;
  width: 30px;
  height: 30px;
  background: #000;
  border-radius: 50%;
  top: 60px;
}

.eye::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  background: #fff;
  border-radius: 50%;
  top: 5px;
  left: 5px;
}

.eye.left { left: 45px; }
.eye.right { right: 45px; }

/* ===== CHEEKS ===== */
.cheek {
  position: absolute;
  width: 35px;
  height: 35px;
  background: #ff4d4d;
  border-radius: 50%;
  bottom: 40px;
  animation: glow 1s infinite alternate;
}

.cheek.left { left: 20px; }
.cheek.right { right: 20px; }

/* ===== NOSE & MOUTH ===== */
.nose {
  position: absolute;
  width: 10px;
  height: 8px;
  background: #000;
  border-radius: 50%;
  top: 95px;
  left: 50%;
  transform: translateX(-50%);
}

.mouth {
  position: absolute;
  width: 60px;
  height: 30px;
  border-bottom: 4px solid #000;
  border-radius: 0 0 60px 60px;
  top: 110px;
  left: 50%;
  transform: translateX(-50%);
}

/* ===== BODY ===== */
.body {
  position: absolute;
  width: 180px;
  height: 140px;
  background: #ffd93b;
  border-radius: 50%;
  top: 150px;
  left: 50%;
  transform: translateX(-50%);
}

/* ===== ARMS ===== */
.arm {
  position: absolute;
  width: 50px;
  height: 30px;
  background: #ffd93b;
  border-radius: 20px;
  top: 40px;
}

.arm.left { left: -20px; transform: rotate(20deg); }
.arm.right { right: -20px; transform: rotate(-20deg); }

/* ===== LEGS ===== */
.leg {
  position: absolute;
  width: 40px;
  height: 30px;
  background: #ffd93b;
  border-radius: 20px;
  bottom: -10px;
}

.leg.left { left: 40px; }
.leg.right { right: 40px; }

/* ===== FIXED TAIL ===== */
.tail {
  position: absolute;
  width: 20px;
  height: 100px;
  background: #ffd93b;
  right: -30px;
  top: 160px;
  transform: rotate(20deg); /* fixed position */
}

.tail::before {
  content: "";
  position: absolute;
  width: 60px;
  height: 20px;
  background: #ffd93b;
  top: 60px;
  left: -40px;
}

/* ===== ANIMATIONS ===== */
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes earWiggle {
  0%,100% { transform: rotate(0); }
  50% { transform: rotate(10deg); }
}

@keyframes glow {
  from { box-shadow: 0 0 5px red; }
  to { box-shadow: 0 0 20px red; }
}
</style>
</head>

<body>

<div class="pikachu">
  <div class="head">
    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="nose"></div>
    <div class="mouth"></div>

    <div class="cheek left"></div>
    <div class="cheek right"></div>
  </div>

  <div class="body">
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  </div>

  <div class="tail"></div>
</div>

</body>
</html>
