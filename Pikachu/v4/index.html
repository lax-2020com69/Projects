<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Pikachu</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
  }

  .pikachu {
    position: relative;
    width: 200px;
    height: 200px;
    background: #ffd93b;
    border-radius: 50%;
  }

  /* Eyes */
  .eye {
    position: absolute;
    top: 60px;
    width: 30px;
    height: 30px;
    background: #000;
    border-radius: 50%;
  }

  .eye::after {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
  }

  .eye.left {
    left: 45px;
  }

  .eye.right {
    right: 45px;
  }

  /* Cheeks */
  .cheek {
    position: absolute;
    bottom: 50px;
    width: 35px;
    height: 35px;
    background: #ff4d4d;
    border-radius: 50%;
  }

  .cheek.left {
    left: 20px;
  }

  .cheek.right {
    right: 20px;
  }

  /* Nose */
  .nose {
    position: absolute;
    top: 95px;
    left: 50%;
    width: 10px;
    height: 8px;
    background: #000;
    border-radius: 50%;
    transform: translateX(-50%);
  }

  /* Mouth */
  .mouth {
    position: absolute;
    top: 110px;
    left: 50%;
    width: 60px;
    height: 30px;
    border-bottom: 4px solid #000;
    border-radius: 0 0 60px 60px;
    transform: translateX(-50%);
  }

  /* Ears */
  .ear {
    position: absolute;
    top: -60px;
    width: 40px;
    height: 80px;
    background: #ffd93b;
    border-radius: 20px;
  }

  .ear::after {
    content: "";
    position: absolute;
    top: 0;
    width: 100%;
    height: 30px;
    background: #000;
    border-radius: 20px 20px 0 0;
  }

  .ear.left {
    left: 20px;
    transform: rotate(-20deg);
  }

  .ear.right {
    right: 20px;
    transform: rotate(20deg);
  }
</style>
</head>
<body>

  <div class="pikachu">
    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="nose"></div>
    <div class="mouth"></div>

    <div class="cheek left"></div>
    <div class="cheek right"></div>
  </div>

</body>
</html>
