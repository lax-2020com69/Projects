<!DOCTTYPE HTML>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE-edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Glass_Container</title>
	<style>
		body {
			background: url(https://hdqwalls.com/wallpapers/fedora-29-stock-rk.jpg);
			background-size: cover;
			/*mix-blend-mode: screan;
			object-fit: cover*/
			width: 100%;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			margin: auto;
			color: white;
		}
		h1 {
			background: linear-gradient(90deg, #00ffff,#ff00de);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			text-align: center;
			position: absolute;
			top:25%;
			right:250px;
			transform: translateX(265px) translateY(-180px);
			font-family: "Arial", sans-serif;
			font-size: 25px;
			font-weight: 600;
			text-shadow: 3px 3px 12px cyan, -3px -3px 12px aqua;
			animation: anim 5.0s linear infinite;
			user-select: none;
		}
		@keyframes anim {
			to{
				transform: translate(75px,15px) rotateY(0deg) scale(2.25);
			}
			from{
				transform: translate(15px,-75px) rotateY(360deg) scale(3.25);
			}
		}
		.container {
			width: 350px;
			height: 200px;
			border: 2px solid rgba(255, 255, 255,0.5);
			border-radius: 20px;
			background: rgb(255, 255, 255,0.3);
			backdrop-filter: blur(3px);
			z-index:0;
			cursor:pointer;
			transition: 0.7s ease-in-out;
		}
		.container:hover {
			transform: rotateY(180deg);
		}
		.master {
			margin: 0;
			padding: 0;
			content: "";
			position: absolute;
			top: 10px;
			right: 15px;
			width: 30px;
			height: 30px;
			border: 0.3px solid rgba(255, 255, 255,0.5);
			border-radius: 20px;
			background: rgb(255, 250, 145,0.8);/*Lightyellow*/
			backdrop-filter: blur(3px);
			z-index: 1;
			cursor: none;
		}
		.master::before {
			margin: 0;
			padding: 0;
			content: "";
			position: absolute;
			top: 0.0px;/*-1.0px*/
			right: 15px;
			transform: translateX();
			width: 30px;
			height: 30px;
			border: 0.3px solid rgba(255, 255, 255,0.5);
			border-radius: 20px;
			background: rgba(240,190,0,0.8);/*Darkyellow*/
			backdrop-filter: blur(3px);
			z-index: 1;
			cursor: none;
		}
		.sim {
			margin: 0;
			padding: 0;
			position: absolute;
			top: 15px;
			left: 25px;
			width: 45px;
			height: 30px;
			border: 2px solid rgba(255, 255, 255,0.5);
			border-radius: none;
			background: rgb(200, 160, 10,0.8);
			backdrop-filter: blur(3px);
			z-index: 1;
			cursor: none;
		}
		.holder {
			margin: 0;
			padding: 0;
			position: absolute;
			top: 135px;
			left: 25px;
			width: 235px;
			height: 50px;
			border: 1px solid rgba(255, 255, 255,0.5);
			border-radius: 5px;
			background: rgb(255, 255, 255,0.1);
			z-index: 1;
			cursor: default;
		}
		.holder > .bankname {
			position: absolute;
			top: 3px;
			left: 5px;
			font-family: "Arial","Arial Narrow", "Segoe UI Semibold","Segoe UI Black","Roboto", sans-serif;
			font-size: 12px;
			font-weight: bold;
			text-transform: uppercase;
			color: #f0f0f0;
			z-index:1;
			cursor:text;
		}
		.holder > .exp {
			position: absolute;
			top: 3px;
			right: 5px;
			font-family: "Arial Narrow", "Arial","Segoe UI Semibold","Segoe UI Black","Roboto", sans-serif;
			font-size: 12px;
			font-weight: none;
			text-transform: uppercase;
			color: #f0f0f0;
			z-index:1;
			cursor: auto;
		}
		.holder > .digits {
			position: absolute;
			top: 10px;
			left: 5px;
			font-family: "Arial Narrow", "Arial","Segoe UI Semibold","Segoe UI Black","Roboto", sans-serif;
			font-size: 16px;
			font-weight: none;
			text-transform: uppercase;
			color: #f0f0f0;
			z-index:1;
			cursor:text;
		}
	</style>
</head>
<body>
	<h1>ATM Card.</h1>
	<div class="container">
		<div class="master"></div>
		<div class="sim"></div>
		<div class="holder">
			<label class="bankname">Liubovpetrenko</label>
			<label class="exp">07/25</label>
			<label class="digits"><pre>5421 7387 5412 4598</pre></label>
		</div>
	</div>
</body>
</html>
